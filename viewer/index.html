<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE360 3D Viewer</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7}#bar{position:fixed;z-index:2;top:10px;left:10px;display:flex;gap:8px}button{padding:10px 14px;border:0;border-radius:10px;background:white;box-shadow:0 2px 10px #0002}</style></head>
<body><div id="bar"><button id="top">TOP</button><button id="persp">PROSPETTIVA</button><button id="reset">RESET</button></div><div id="app"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const app=document.getElementById('app'), scene=new THREE.Scene(); scene.background=new THREE.Color(0xf1f5f9); const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,500); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); app.appendChild(renderer.domElement); const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.2)); const grid=new THREE.GridHelper(20,40); scene.add(grid); let root=null;
function home(){camera.position.set(7,-7,6);controls.target.set(0,0,1);controls.update()} home(); const params=new URLSearchParams(location.search); const glb=params.get('glb'); if(glb)new GLTFLoader().load(glb,g=>{root=g.scene;scene.add(root);});
document.getElementById('top').onclick=()=>{camera.position.set(0,0,12);controls.target.set(0,0,0);controls.update()}; document.getElementById('persp').onclick=home; document.getElementById('reset').onclick=home; addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
